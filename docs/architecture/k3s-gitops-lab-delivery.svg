<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k3s-gitops-lab-delivery-title k3s-gitops-lab-delivery-desc">
<title id="k3s-gitops-lab-delivery-title">k3s-gitops-lab delivery paths</title>
<desc id="k3s-gitops-lab-delivery-desc">Swimlane comparing the two delivery paths of k3s-gitops-lab: every change merges to main through required checks; app changes build and sign an image and a bot pull request moves the shared image pin back through the same checks; then deploy-push joins the tailnet and applies namespace push, while Argo CD polls main and syncs namespace gitops.</desc>
