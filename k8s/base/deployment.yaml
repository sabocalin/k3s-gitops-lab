# The app's Deployment. #28: replicas and rollout. #29: probes. #30: resources.
# #31: securityContext (the namespace also enforces Pod Security "restricted").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
spec:
  # No replicas: here. The HPA (#34, hpa.yaml) owns the count: 3 to 5 pods. Three at least
  # (#28): not for node failure (there is one node), but so a rollout or a crashed pod
  # never leaves zero pods serving. A new Deployment starts at 1 until the HPA's first pass.
  # Keep 5 old ReplicaSets for `kubectl rollout undo` (the default is 10).
  revisionHistoryLimit: 5
  # Mark the rollout failed if it makes no progress in 2 minutes (default 10).
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never go below 3 ready pods: an old pod is removed only after a new one is READY.
      maxUnavailable: 0
      # One extra pod at a time (4 during a rollout), so memory on the 2 GiB node stays bounded.
      maxSurge: 1
  # Written here, not by a Kustomize label transformer: that transformer would also rewrite
  # the peer selectors in NetworkPolicies (#33). Immutable after creation.
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-api
    spec:
      # SIGTERM → wait at most this long for the pod to exit (preStop counts towards it).
      terminationGracePeriodSeconds: 30
      # #31: the app never calls the Kubernetes API, so it gets no token to steal.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true # refuse to start if the image would run as root
        runAsUser: 65532 # the image's nonroot user (#20), stated here too
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault # the container runtime's syscall filter
      containers:
        - name: lab-api
          # No tag or digest here: each overlay pins the digest (images:), so the base
          # never names a specific build.
          image: ghcr.io/sabocalin/k3s-gitops-lab/lab-api
          # #31: nothing to write (bytecode is precompiled, #20), no privileges to gain.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false # no setuid/setcap binaries can raise privileges
            capabilities:
              drop: ["ALL"] # port 8000 > 1024: not even NET_BIND_SERVICE is needed
          ports:
            - name: http
              containerPort: 8000
          # #30: measured idle 3m CPU / 37Mi, about 75m at 158 req/s over 3 pods, memory flat.
          # requests: what the scheduler reserves, and the base HPA (#34) measures CPU against.
          # limits: memory over 128Mi is OOM-killed (protects the 2 GiB node); CPU over 250m is
          # throttled, not killed.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # #29: three questions, three probes. Liveness and startup ask /health (is the
          # process alive?); readiness asks /ready (should it get traffic?). Liveness must
          # never depend on readiness: a busy or draining pod would be killed for it.
          #
          # startup: "has it finished starting?" Until it passes, liveness and readiness are
          # not run, so a slow start is never mistaken for a hang. Up to 30 x 2 s = 60 s.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 1
          # liveness: "is it stuck?" On failure: RESTART. Deliberately slow to fire:
          # 3 misses x 10 s, so a GC pause or a burst never causes a restart.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # readiness (#28): "send it traffic?" On failure: out of the Service endpoints,
          # NO restart. Fast both ways (2 s): it gates every rollout and drain.
          # /ready is 503 while starting, draining (SIGUSR1) or shutting down.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
            timeoutSeconds: 1
          lifecycle:
            # On removal, "drop from Service endpoints" and "send SIGTERM" happen at the same
            # time; routers learn of the first a moment later. Sleeping 5 s before SIGTERM
            # keeps the old pod serving until no one routes to it. A built-in sleep action:
            # distroless has no `sleep` binary.
            preStop:
              sleep:
                seconds: 5
