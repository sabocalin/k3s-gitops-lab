# The app's Deployment. #28: replicas and rollout. #29: probes. Later tasks add
# requests/limits (#30), securityContext (#31).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
spec:
  # #28: three replicas on one node. Not for node failure (there is one node), but so a
  # rollout or a crashed pod never leaves zero pods serving.
  replicas: 3
  # Keep 5 old ReplicaSets for `kubectl rollout undo` (the default is 10).
  revisionHistoryLimit: 5
  # Mark the rollout failed if it makes no progress in 2 minutes (default 10).
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never go below 3 ready pods: an old pod is removed only after a new one is READY.
      maxUnavailable: 0
      # One extra pod at a time (4 during a rollout), so memory on the 2 GiB node stays bounded.
      maxSurge: 1
  selector:
    matchLabels: {} # filled by kustomization.yaml labels (app.kubernetes.io/name)
  template:
    spec:
      # SIGTERM → wait at most this long for the pod to exit (preStop counts towards it).
      terminationGracePeriodSeconds: 30
      containers:
        - name: lab-api
          # No tag or digest here: each overlay pins the digest (images:), so the base
          # never names a specific build.
          image: ghcr.io/sabocalin/k3s-gitops-lab/lab-api
          ports:
            - name: http
              containerPort: 8000
          # #29: three questions, three probes. Liveness and startup ask /health (is the
          # process alive?); readiness asks /ready (should it get traffic?). Liveness must
          # never depend on readiness: a busy or draining pod would be killed for it.
          #
          # startup: "has it finished starting?" Until it passes, liveness and readiness are
          # not run, so a slow start is never mistaken for a hang. Up to 30 x 2 s = 60 s.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 1
          # liveness: "is it stuck?" On failure: RESTART. Deliberately slow to fire:
          # 3 misses x 10 s, so a GC pause or a burst never causes a restart.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # readiness (#28): "send it traffic?" On failure: out of the Service endpoints,
          # NO restart. Fast both ways (2 s): it gates every rollout and drain.
          # /ready is 503 while starting, draining (SIGUSR1) or shutting down.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
            timeoutSeconds: 1
          lifecycle:
            # On removal, "drop from Service endpoints" and "send SIGTERM" happen at the same
            # time; routers learn of the first a moment later. Sleeping 5 s before SIGTERM
            # keeps the old pod serving until no one routes to it. A built-in sleep action:
            # distroless has no `sleep` binary.
            preStop:
              sleep:
                seconds: 5
