# #27: stable in-cluster address for the pods; Ingress (#35) routes to it.
apiVersion: v1
kind: Service
metadata:
  name: lab-api
spec:
  type: ClusterIP
  selector: {} # filled by kustomization.yaml labels (app.kubernetes.io/name)
  ports:
    - name: http
      port: 80
      targetPort: http # the container port's name, not its number
