# #27: what the app IS, identical in every namespace. Overlays (k8s/overlays/*) add
# WHERE it runs: namespace, deploy-path label, image digest.
# #38: only what a deployer may change. The namespace's guardrails (Pod Security, quota,
# limits, network policy) live in k8s/namespace-base and k8s/namespaces/*, applied by an
# admin, so a deploy can never weaken them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml # #32
  - hpa.yaml # #34

labels:
  # On every object's metadata only. The selectors (Deployment, Service, PDB) spell out
  # app.kubernetes.io/name themselves: includeSelectors would also rewrite the peer
  # selectors inside NetworkPolicies, turning "Traefik's pods" into "lab-api pods" (#33).
  - pairs:
      app.kubernetes.io/name: lab-api
    includeSelectors: false
  # Not in selectors, so changing these later never touches one. includeTemplates: also on
  # the pods, where NetworkPolicy (#33) and metrics select by label.
  - pairs:
      app.kubernetes.io/part-of: k3s-gitops-lab
    includeSelectors: false
    includeTemplates: true
