# #35: public HTTP entry. K3s's Traefik (kube-system) reads Ingress objects, opens a router
# for each rule and forwards to the Service's ready pod IPs (from its EndpointSlices; the
# ClusterIP is not used). Reached at http://<public-ip>.sslip.io/ on port 80.
#
# In the push overlay only: two host-less Ingresses (push and gitops) would claim the same
# requests. How the gitops copy is exposed is decided with ArgoCD (#42/#44).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-api
  annotations:
    # Only the plain-HTTP entry point (:80) for now; cert-manager and HTTPS come in #36.
    # Without this, Traefik also serves the route on :443 with its self-signed certificate.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik # explicit, though it is K3s's default class
  rules:
    # No host: the public IP, and so <ip>.sslip.io, changes on every start (#61), and a host
    # written here would be stale after the next one. Any Host header matches.
    - http:
        paths:
          # An allowlist of Exact paths. "Prefix: /" would also publish /metrics, /ready
          # and FastAPI's /docs and /openapi.json. /metrics stays in-cluster (#48).
          - path: /
            pathType: Exact
            backend:
              service:
                name: lab-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: lab-api
                port:
                  name: http
