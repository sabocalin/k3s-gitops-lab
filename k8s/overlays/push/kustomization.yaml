# #27: the "push" deploy path. GitHub Actions applies this overlay with kubectl apply -k (#39).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every object from the base lands in this namespace. The Namespace itself, and its
# guardrails, are k8s/namespaces/push (#38): applied by an admin, before this overlay.
namespace: push

resources:
  - ../../base
  - ingress.yaml # #35
  - middleware.yaml # #36

labels:
  # Not in selectors; also on the pods (includeTemplates). Which delivery path manages
  # these objects. part-of again here, as in k8s/namespaces/*, so every object carries it.
  - pairs:
      k3s-gitops-lab/deploy-path: push
      app.kubernetes.io/part-of: k3s-gitops-lab
    includeSelectors: false
    includeTemplates: true

# The exact build, by digest: signed by CI (#25). A tag could be moved; a digest cannot.
images:
  - name: ghcr.io/sabocalin/k3s-gitops-lab/lab-api
    digest: sha256:1b6125331f632d5d713bdc760a6f0f3d6049cdc56a498f3e38f31493e8c6ddd2
