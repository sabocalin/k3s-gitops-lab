# #27: the "push" deploy path. GitHub Actions applies this overlay with kubectl apply -k (#39).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every object from the base, and the Namespace itself, lands in this namespace.
namespace: push

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml # #35

labels:
  # Not in selectors; also on the pods (includeTemplates). Which delivery path manages
  # these objects. part-of again here so the Namespace (not from the base) carries it too.
  - pairs:
      k3s-gitops-lab/deploy-path: push
      app.kubernetes.io/part-of: k3s-gitops-lab
    includeSelectors: false
    includeTemplates: true

# The exact build, by digest: signed by CI (#25). A tag could be moved; a digest cannot.
images:
  - name: ghcr.io/sabocalin/k3s-gitops-lab/lab-api
    digest: sha256:7952a1567b7da01e15b033fb407d3a0ecb50670dbb647b18eca7fa13254d5279
