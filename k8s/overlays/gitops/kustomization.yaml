# #27: the "gitops" deploy path. ArgoCD syncs this overlay from git (#40-42); CI bumps the digest here (#41).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every object from the base lands in this namespace. The Namespace itself, and its
# guardrails, are k8s/namespaces/gitops (#38): applied by an admin, before this overlay.
namespace: gitops

resources:
  - ../../base

labels:
  # Not in selectors; also on the pods (includeTemplates). Which delivery path manages
  # these objects. part-of again here, as in k8s/namespaces/*, so every object carries it.
  - pairs:
      k3s-gitops-lab/deploy-path: gitops
      app.kubernetes.io/part-of: k3s-gitops-lab
    includeSelectors: false
    includeTemplates: true

# The exact build, by digest, signed by CI (#25): set in a Component shared with the push
# overlay (#44), which CI updates through a PR after every publish (#41). Argo CD deploys
# whatever main says (#42).
components:
  - ../../components/lab-api-image
