# #38: the "gitops" namespace and its guardrails, applied by an admin (later ArgoCD, #43),
# before k8s/overlays/gitops. Pod Security level, quota, limits and network policy are set
# here, out of reach of whoever deploys the app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops

resources:
  - namespace.yaml
  - ../../namespace-base

labels:
  # The same labels as k8s/overlays/gitops, so these objects look as they did before #38.
  - pairs:
      k3s-gitops-lab/deploy-path: gitops
      app.kubernetes.io/part-of: k3s-gitops-lab
    includeSelectors: false
