# #33: pod firewall, enforced by K3s's embedded network policy controller (kube-router,
# iptables on the node). Policies only ever ADD allowed traffic: a pod selected by any
# policy for a direction accepts only what some policy allows; everything else is dropped.
#
# 1. Nothing in, nothing out, for every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {} # every pod in the namespace, including ones added later
  # Egress too: the app makes no outbound calls (no DNS, no API server, no internet), so a
  # compromised pod gets nowhere. Without "Egress" here, egress would stay open.
  policyTypes:
    - Ingress
    - Egress
---
# 2. The app accepts Traefik (the ingress controller, #35) and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-lab-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ONE list item with both selectors = AND: Traefik's pods, in kube-system.
        # As two items ("- namespaceSelector" and "- podSelector") it would be OR: every pod
        # in kube-system, plus any pod labelled traefik in THIS namespace.
        - namespaceSelector:
            matchLabels:
              # Set by the API server on every namespace; cannot be faked by renaming.
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        # The POD's port (container port "http" = 8000), not the Service's port 80: policies
        # are checked after the Service has been translated to a pod address.
        - port: http
          protocol: TCP
---
# 3. #36: cert-manager's HTTP-01 solver. While a certificate is being issued, cert-manager
# runs a solver pod in this namespace and an Ingress for /.well-known/acme-challenge/<token>.
# Let's Encrypt fetches that URL through Traefik; default-deny would drop it at the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true" # set by cert-manager on every solver pod
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8089 # the solver's fixed listen port
          protocol: TCP
