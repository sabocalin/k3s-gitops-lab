# #48, #54: the Grafana Cloud access-policy token (scopes metrics:write, logs:write), from
# SSM through External Secrets. ESO creates and owns the Secret "grafana-cloud"; nothing
# secret is in git. The store only serves this namespace, and its role only this path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: grafana-cloud
  data:
    - secretKey: token
      remoteRef:
        key: /k3s-gitops-lab/grafana-cloud/alloy-token
