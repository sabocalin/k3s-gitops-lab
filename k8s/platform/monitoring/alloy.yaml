# #48: Grafana Alloy, one replica (one node). Upstream ships a Helm chart only; these are
# the few objects it would render for this setup, written out so every field is visible.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
automountServiceAccountToken: true # Alloy talks to the API (discovery, pod logs)
---
# Read-only: find pods, stream their logs. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  # One writer at a time: a second replica would send every log line twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        # The image sets no USER, so it would run as root. 473 is the alloy user its
        # Dockerfile creates; every writable path is an emptyDir below.
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - --stability.level=generally-available
            # No anonymous usage reporting to Grafana.
            - --disable-reporting
          env:
            - name: GRAFANA_CLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud
                  key: token
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 500m, memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy-config
        # The write-ahead log for metrics and log positions: lost on restart, which only
        # means a short gap or a few duplicate lines. No PersistentVolume needed.
        - name: data
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
