# #54: AWS SSM Parameter Store in this account and region. No credentials in here: the
# controller's default AWS credential chain finds the node role through IMDS (it runs with
# hostNetwork), then assumes `role`, which can read /k3s-gitops-lab/grafana-cloud/* only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-central-1
      role: arn:aws:iam::466558795290:role/k3s-gitops-lab-eso
  # Only ExternalSecrets in these namespaces may use this store. Everything else gets
  # "not allowed to use this store", whatever key it asks for.
  conditions:
    - namespaces:
        - monitoring
