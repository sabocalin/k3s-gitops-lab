# #42, #43: what Argo CD deploys. The root Application syncs this directory (app-of-apps),
# itself included. Bootstrap on a new cluster, once, after ../argocd is running:
#   kubectl apply -k k8s/platform/argocd-apps
# From then on a change here is a PR: root applies it within one git poll (3 min).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD core only watches Applications and AppProjects in its own namespace.
namespace: argocd

resources:
  - appproject-platform.yaml
  - appproject-gitops.yaml
  - application-root.yaml
  - application-argocd.yaml
  - application-cert-manager.yaml
  - application-cluster-issuers.yaml
  - application-external-secrets.yaml
  - application-secret-stores.yaml
  - application-monitoring.yaml
  - application-system-upgrade.yaml
  - application-upgrade-plans.yaml
  - application-lab-api-gitops.yaml
