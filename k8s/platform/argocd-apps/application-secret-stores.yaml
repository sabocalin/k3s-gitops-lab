# #54: the ClusterSecretStore(s), from k8s/platform/secret-stores. Separate from
# external-secrets for the same reason as cluster-issuers (#43): instances of its CRDs,
# validated by its webhook, so they can only be applied once ESO runs; the retry carries it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
spec:
  project: platform
  source:
    repoURL: https://github.com/sabocalin/k3s-gitops-lab.git
    targetRevision: main
    path: k8s/platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
    # Only cluster-scoped objects; a destination namespace is still required.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - FailOnSharedResource=true
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
