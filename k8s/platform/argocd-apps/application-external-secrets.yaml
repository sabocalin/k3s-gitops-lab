# #54: External Secrets Operator, from k8s/platform/external-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
spec:
  project: platform
  source:
    repoURL: https://github.com/sabocalin/k3s-gitops-lab.git
    targetRevision: main
    path: k8s/platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      # CRDs and the Namespace carry Prune=false (kustomization.yaml).
      prune: true
      selfHeal: true
    syncOptions:
      # Several ESO CRDs exceed client-side apply's 256 KiB last-applied annotation.
      - ServerSideApply=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
