# #51: system-upgrade-controller, from k8s/platform/system-upgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade
spec:
  project: platform
  source:
    repoURL: https://github.com/sabocalin/k3s-gitops-lab.git
    targetRevision: main
    path: k8s/platform/system-upgrade
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      # The CRD and the Namespace carry Prune=false (kustomization.yaml).
      prune: true
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
