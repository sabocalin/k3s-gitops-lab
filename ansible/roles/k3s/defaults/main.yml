# Pinned. What a fresh node (make up, the weekly rebuild) installs. A running node is
# upgraded by system-upgrade-controller from k8s/platform/upgrade-plans (#51): change both
# in one PR. v1.37.1+k3s1: the v1.37 channel's latest on 2026-10-09, 9 days old.
k3s_version: v1.37.1+k3s1
k3s_node_name: k3s-node
k3s_release_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}"

# #90: pod and service ranges. K3s's defaults (10.42.0.0/16, 10.43.0.0/16) overlapped the
# VPC (10.42.0.0/16): CoreDNS's upstream, the VPC resolver 10.42.0.2, landed in the pod subnet
# and every external lookup timed out. The guard task refuses any overlap with the VPC.
# Changing these needs a fresh cluster (make down, make up).
k3s_cluster_cidr: 10.52.0.0/16
k3s_service_cidr: 10.53.0.0/16
k3s_cluster_dns: 10.53.0.10 # inside k3s_service_cidr
# Upstream DNS for CoreDNS and pods: Amazon's resolver at its link-local address, the same
# whatever the VPC's range. No search domains, so pods stop inheriting the node's tailnet one.
k3s_upstream_dns: 169.254.169.253

# #39: the API server also accepts GitHub Actions OIDC tokens, from this repository's
# "production" environment only (main, push deploys). Immutable subject format: owner and
# repository by ID, so a renamed or re-created repository cannot inherit the trust.
k3s_github_oidc_audience: k3s-gitops-lab
k3s_github_oidc_subject: "repo:sabocalin@238511101/k3s-gitops-lab@1385841640:environment:production"
k3s_github_oidc_repository_id: "1385841640"
