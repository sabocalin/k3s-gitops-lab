- name: Refuse anything but arm64 (the pinned binary is k3s-arm64)
  ansible.builtin.assert:
    that: ansible_facts.architecture == "aarch64"
    fail_msg: "expected aarch64, got {{ ansible_facts.architecture }}"
    quiet: true

# #90: fail closed. The VPC's ranges come from the instance metadata service (IMDSv2), so
# the check needs no assumption about the network; an overlap stops the play before K3s
# is configured.
- name: Pod and service ranges must not overlap the VPC
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress, sys, urllib.request
        base = "http://169.254.169.254/latest"
        def get(path, token=None, method="GET", headers=None):
            req = urllib.request.Request(base + path, method=method, headers=headers or {})
            if token:
                req.add_header("X-aws-ec2-metadata-token", token)
            with urllib.request.urlopen(req, timeout=3) as r:
                return r.read().decode()
        token = get("/api/token", method="PUT",
                    headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"})
        mac = get("/meta-data/mac", token)
        vpc = [ipaddress.ip_network(c) for c in
               get(f"/meta-data/network/interfaces/macs/{mac}/vpc-ipv4-cidr-blocks", token).split()]
        bad = [f"{name} {net} overlaps VPC {v}"
               for name, net in (("pods", ipaddress.ip_network(sys.argv[1])),
                                 ("services", ipaddress.ip_network(sys.argv[2])))
               for v in vpc if net.overlaps(v)]
        if bad:
            sys.exit("; ".join(bad))
        print("no overlap with VPC " + ", ".join(map(str, vpc)))
      - "{{ k3s_cluster_cidr }}"
      - "{{ k3s_service_cidr }}"
  register: cidr_check
  changed_when: false
  check_mode: false

- name: Read this node's Tailscale identity (for the API certificate)
  ansible.builtin.command: tailscale status --json --self
  register: ts_status
  changed_when: false
  check_mode: false

- name: Certificate names come from Tailscale, not from assumptions
  ansible.builtin.set_fact:
    k3s_tls_sans:
      - "{{ (ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
      - "{{ k3s_node_name }}"
      - "{{ (ts_status.stdout | from_json).Self.TailscaleIPs | select('search', '^100\\.') | first }}"

- name: K3s binary, verified against the release checksum file
  ansible.builtin.get_url:
    url: "{{ k3s_release_url }}/k3s-arm64"
    checksum: "sha256:{{ k3s_release_url }}/sha256sum-arm64.txt"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  register: k3s_binary
  notify: Restart k3s

- name: K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: K3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: K3s API authentication config (#39, GitHub Actions OIDC)
  ansible.builtin.template:
    src: authentication-config.yaml.j2
    dest: /etc/rancher/k3s/authentication-config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: K3s pod DNS upstream (#90)
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: K3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  register: k3s_unit
  notify:
    - Reload systemd
    - Restart k3s

- name: Apply pending restarts before checking health
  ansible.builtin.meta: flush_handlers

# On a fresh host under --check, the binary and unit only "would be" installed: there is
# no k3s service to query yet. On an installed host these still run in check mode.
- name: Note whether K3s is only simulated
  ansible.builtin.set_fact:
    k3s_simulated: "{{ ansible_check_mode and (k3s_binary is changed or k3s_unit is changed) }}"

- name: K3s enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
  when: not k3s_simulated

- name: Wait until the node reports Ready
  # argv, not a command string: the string form is split shell-style, which strips the
  # quotes and turns "Ready" into an identifier that jsonpath rejects.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - "{{ k3s_node_name }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  changed_when: false
  check_mode: false
  until: node_ready.stdout == "True"
  retries: 30
  delay: 5
  when: not k3s_simulated
