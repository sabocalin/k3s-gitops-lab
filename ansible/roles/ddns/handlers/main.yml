- name: Reload systemd for DuckDNS
  ansible.builtin.systemd_service:
    daemon_reload: true

# restarted: a changed script or unit takes effect now, not only at the next boot.
- name: Run the DuckDNS update
  ansible.builtin.systemd_service:
    name: duckdns-update
    state: restarted
  when: not (ansible_check_mode and ddns_unit is changed)
