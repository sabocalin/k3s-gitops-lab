# Read from the current directory: always run from ansible/ (./run.sh does).
[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = /usr/bin/python3
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml

[ssh_connection]
# ssh reads ~/.ssh/config, whose "Host k3s-node" entry tunnels through Tailscale.
pipelining = True
# Short ControlPersist: a reused connection must not make a later check pass by itself.
ssh_args = -o ControlMaster=auto -o ControlPersist=30s
