# AI code review on pull requests: one Gemini request per run (.github/scripts/ai_review.py).
# Advisory only. NOT a required status check: an LLM outage or quota limit must
# never block a merge. Free-tier prompts are used by Google for training; fine
# for this public repo, never reuse this setup on employer code.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ai-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Skip drafts (save quota), Dependabot (gets no repo secrets), and fork PRs
    # (get no secrets under pull_request, by design).
    if: >-
      !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # read the repository and its history to build the diff
      pull-requests: write # post the review and its line comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the diff needs the merge base and the previous push
          persist-credentials: false

      - name: Unit tests for the reviewer script
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # OpenAI-compatible Gemini endpoint (full chat-completions URL).
          LLM_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          # Tried in order. Free-tier quotas are per model (measured for 3.6-flash:
          # 5/min, 20/day), so a fallback list multiplies capacity. gemini-2.5-flash is retired for new
          # keys; see docs/learning/57-ai-review.md.
          MODELS: gemini-3.6-flash,gemini-3.8-flash,gemini-3.1-flash-lite
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_ACTION: ${{ github.event.action }}
        run: python3 .github/scripts/ai_review.py
