# #27: render every Kustomize overlay (k8s/overlays/*), with its namespace part
# (k8s/namespaces/*, #38), and the platform components (k8s/platform/*, #36), using the
# pinned kustomize, and check the invariants. Same script as `make k8s`.
# Runs on every PR, not only ones touching k8s/, because it is a required status check:
# a required check that never reports blocks the merge.
name: k8s

on:
  pull_request:
  push:
    branches: [main]

# Deny everything at workflow level; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: k8s-render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq (mikefarah v4) and jq come with the runner image; kustomize is hash-pinned.
      - name: Render and check overlays
        run: scripts/render-k8s.sh rendered

      - name: Rendered manifests in the job summary
        run: |
          for f in rendered/*.yaml; do
            printf '<details><summary>%s</summary>\n\n```yaml\n' "$(basename "$f")"
            cat "$f"
            printf '```\n</details>\n\n'
          done >> "$GITHUB_STEP_SUMMARY"
