# #22: build the app image natively on arm64 (the node is a Graviton t4g) and, on main,
# push it to GHCR tagged with the full git SHA. Never a :latest tag.
#
#   pull_request  build + vulnerability scan + smoke test; this job cannot write packages
#   push to main  the same, then push ghcr.io/sabocalin/k3s-gitops-lab/lab-api:<sha>
#                 with signed build provenance and an SBOM attestation (#24)
#                 and a keyless cosign signature (#25), then a PR that moves the gitops
#                 overlay to it (#41)
#
# Plain `docker buildx` (preinstalled on the runner) instead of docker/build-push-action:
# one less action to trust, and every flag is visible here.
name: image

on:
  pull_request:
    paths:
      - app/**
      - scripts/smoke-image.sh
      - scripts/scan-image.sh
      - scripts/sbom-image.sh
      - scripts/sign-image.sh
      - scripts/verify-image.sh
      - scripts/lib/tools.sh
      - .trivyignore.yaml
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - app/**
      - scripts/smoke-image.sh
      - scripts/scan-image.sh
      - scripts/sbom-image.sh
      - scripts/sign-image.sh
      - scripts/verify-image.sh
      - scripts/lib/tools.sh
      - .trivyignore.yaml
      - .github/workflows/image.yml
  workflow_dispatch:

# Deny everything at workflow level; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR builds; never cancel a push to the registry halfway on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sabocalin/k3s-gitops-lab/lab-api

jobs:
  build:
    name: image-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build (linux/arm64, not pushed)
        run: |
          docker buildx build app \
            --platform linux/arm64 \
            --provenance=false --sbom=false \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --load

      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        run: scripts/scan-image.sh "$IMAGE:$GITHUB_SHA"

      - name: Smoke test
        run: scripts/smoke-image.sh "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA"

      # Generated on PRs too, so a broken SBOM step shows up before merge (not attested).
      - name: SBOM (CycloneDX)
        run: scripts/sbom-image.sh "$IMAGE:$GITHUB_SHA" sbom.cdx.json

  publish:
    name: image-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }} # for gitops-bump (#41)
    permissions:
      contents: read
      packages: write # push the image and its attestations to ghcr.io/<owner>/...
      id-token: write # OIDC token -> Sigstore (Fulcio) certificate: attestations and cosign signature
      attestations: write # store the attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --provenance/--sbom off: buildx would otherwise wrap the image in an index with an
      # extra "unknown/unknown" entry. Provenance and SBOM come as GitHub attestations (#24).
      # The source label links the package to this repository on GitHub.
      - name: Build (linux/arm64)
        run: |
          docker buildx build app \
            --platform linux/arm64 \
            --provenance=false --sbom=false \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --load

      # Nothing is pushed unless the image has no fixable HIGH/CRITICAL vulnerability
      # and works from the outside. The scan comes first: static, and it rejects a bad
      # base before anything runs.
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        run: scripts/scan-image.sh "$IMAGE:$GITHUB_SHA"

      - name: Smoke test
        run: scripts/smoke-image.sh "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA"

      - name: SBOM (CycloneDX)
        run: scripts/sbom-image.sh "$IMAGE:$GITHUB_SHA" sbom.cdx.json

      - name: Log in to GHCR
        env:
          # The job's short-lived token; --password-stdin keeps it off the command line.
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push to GHCR
        id: push
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image pushed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| Digest | \`$ref\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pushed $ref"

      # #24: signed statements about the pushed digest, keyless: the job's OIDC identity
      # gets a short-lived Sigstore certificate naming this workflow; the signature is
      # recorded in Rekor (public transparency log) and the attestation is stored on GitHub
      # and pushed next to the image in GHCR. Check with: gh attestation verify oci://...
      # create-storage-record: off; it needs an extra permission and is for GitHub's
      # artifact-metadata feature, which this project does not use.
      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      # #25: a cosign signature over the digest, keyless (same OIDC identity as above),
      # stored in GHCR next to the image; sign-image.sh verifies it straight after.
      # Check from anywhere: scripts/verify-image.sh <image>@sha256:<digest>
      - name: Sign with cosign (keyless) and verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: scripts/sign-image.sh "$IMAGE@$DIGEST"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # #41: point the gitops overlay at the image just published, through a PR that merges
  # itself once the required checks pass. A GitHub App opens it: a PR opened with the job's
  # own GITHUB_TOKEN would not start the required check workflows (GitHub's guard against
  # workflows triggering workflows), so it could never merge.
  bump-gitops:
    name: gitops-bump
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # main only; also where the App's private key lives (environment secret).
    environment: production
    permissions:
      contents: read # checkout; every write goes through the App's token
    steps:
      # The latest main (not the build commit): the bump PR is based on what main is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Deploy only what image.yml signed: checked again here, from the registry.
      - name: Verify the image signature
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: scripts/verify-image.sh "$IMAGE@$DIGEST"

      # A token for this repository only, narrowed to the two permissions the bump needs,
      # valid for an hour and revoked when the job ends.
      - name: GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the gitops bump PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: scripts/bump-gitops-image.sh "$IMAGE@$DIGEST"
