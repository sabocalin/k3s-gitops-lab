# #64: the weekly rebuild drill. Every Sunday the node is destroyed and built again from
# git, end to end, with nobody logged in:
#
#   rebuild   terraform destroy + apply (apply role, environment production); the new node
#             restores its identity and configures itself at first boot (user_data,
#             scripts/node-bootstrap.sh: Ansible locally, then Argo CD, which deploys the
#             platform and namespace gitops)
#   deploy    the push path (deploy-push.yml) deploys namespace push, waiting for the new
#             node's API, RBAC and certificate
#   finish    https://k3s-gitops-lab.duckdns.org/health must answer 200 with a valid
#             certificate; then the node is stopped (it ran only for the drill) and the
#             total time goes to the job summary
#
# Why: proves every week that git is enough to rebuild the platform, so a manual fix on
# the node cannot hide (it would vanish on Sunday). A failed run is red and GitHub emails
# the workflow's author.
name: rebuild

on:
  schedule:
    # Sundays 03:17 UTC (06:17 in Bucharest): the node is normally stopped then. Not on
    # the hour, when GitHub's scheduler is busiest and delays runs.
    - cron: "17 3 * * 0"
  workflow_dispatch:

# Deny everything at workflow level; each job asks for exactly what it needs.
permissions: {}

# Shares the lab group with the Start lab button (lab.yml): a press never lands in the
# middle of a rebuild.
concurrency:
  group: lab
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  APPLY_ROLE: arn:aws:iam::466558795290:role/k3s-gitops-lab-github-apply

jobs:
  rebuild:
    name: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # main only (branch policy); the apply role trusts exactly environment:production.
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS
    outputs:
      started: ${{ steps.start.outputs.at }}
      ip: ${{ steps.build.outputs.ip }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy and rebuild the node
        id: build
        run: scripts/rebuild-node.sh

  deploy:
    needs: rebuild
    # Self-repository form (GitHub, July 2026): this repository at this run's commit, not
    # whatever is checked out on a runner.
    uses: $/.github/workflows/deploy-push.yml
    permissions:
      contents: read
      id-token: write
    with:
      # The new node's bootstrap (Argo CD, namespaces) and cert-manager's first
      # certificate take a few minutes after Traefik first answers.
      wait_seconds: 900

  finish:
    name: finish
    needs: [rebuild, deploy]
    # Always: a failed rebuild must still stop the node it started.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # From outside, as a user: DNS, certificate (curl verifies it), Traefik, the app.
      - name: Public HTTPS health
        id: health
        if: needs.deploy.result == 'success'
        env:
          STARTED: ${{ needs.rebuild.outputs.started }}
        run: |
          url=https://k3s-gitops-lab.duckdns.org/health
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")
          total=$(( $(date +%s) - STARTED ))
          {
            echo "| Public HTTPS \`$url\` | $code |"
            printf '| **Total, destroy to healthy** | **%d min %02d s** |\n' $((total / 60)) $((total % 60))
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || { echo "::error::$url answered $code"; exit 1; }
          echo "$url -> 200; total ${total}s"

      # The node ran only for the drill. lab.sh in CI mode allows start|stop|extend.
      - name: Stop the node
        if: always()
        run: scripts/lab.sh stop

      - name: Fail the run if any step failed
        if: needs.rebuild.result != 'success' || needs.deploy.result != 'success' || steps.health.outcome != 'success'
        env:
          REBUILD: ${{ needs.rebuild.result }}
          DEPLOY: ${{ needs.deploy.result }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          echo "::error::rebuild=$REBUILD deploy=$DEPLOY health=$HEALTH"
          exit 1
