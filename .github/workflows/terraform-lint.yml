# #17: static checks for terraform/ on every PR: fmt, validate, tflint, trivy config.
# Runs scripts/lint-terraform.sh, the same script as `make lint`. No AWS credentials
# (the checks read code only), so pull requests from forks get the same checks.
# Runs on every PR, not only ones touching terraform/, because it is a required status
# check: a required check that never reports blocks the merge.
name: terraform-lint

on:
  pull_request:
  push:
    branches: [main]

# Deny everything at workflow level; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-lint:
    name: terraform-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false # plain exit codes and output

      - name: Lint Terraform
        env:
          # tflint --init downloads the AWS ruleset from GitHub releases; a token avoids
          # the anonymous API rate limit. Read-only, public data only.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/lint-terraform.sh
